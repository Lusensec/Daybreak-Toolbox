# 破晓·工具箱 —— 多平台打包 & GitHub Release
# 触发：
#   - push 标签 v*（四个平台并行构建，首个上传步骤幂等创建 Release 后挂附件）
#   - 手动 workflow_dispatch（仅构建，产物存普通 Artifact）
#
# 附件命名：Daybreak-Toolbox-<tag|-manual-><平台>.zip
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # v2.0.14 起：测试门禁 —— 全量 pytest + 前端构建，先于 5 个平台构建跑（构建 job 以 needs 依赖它）
  tests:
    runs-on: windows-latest  # 测试含 Windows 专有单测（ctypes/win32 窗口几何），必须 Windows runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install bridge dependencies
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        run: python -m pytest -q

      - name: Build web frontend (vite → web/dist)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-suffix: win-x64
            pyinstaller: --onedir --noconsole
            add-data-sep: ";"
            icon: packaging/daybreak_logo.ico
          - os: macos-latest
            artifact-suffix: mac-arm64
            pyinstaller: --onedir --windowed
            add-data-sep: ":"
            icon: ""
          - os: macos-15
            artifact-suffix: mac-x64
            pyinstaller: --onedir --windowed
            add-data-sep: ":"
            icon: ""
          - os: ubuntu-24.04
            artifact-suffix: linux-x64
            pyinstaller: --onedir
            add-data-sep: ":"
            icon: ""
          # Windows 安装程序（Inno Setup，windows-latest runner 预装 iscc）：复用 Windows 构建链 + 打包 setup.exe
          - os: windows-latest
            artifact-suffix: win-setup
            pyinstaller: --onedir --noconsole
            add-data-sep: ";"
            icon: packaging/daybreak_logo.ico
            build-setup: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Build web frontend (vite → web/dist)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies + PyInstaller
        run: |
          pip install -r requirements.txt
          pip install "setuptools<81" pyinstaller

      - name: Build executable
        shell: bash
        run: |
          sep="${{ matrix.add-data-sep }}"
          # 窗口模式（方案 A，pywebview）：pythonnet/.NET 运行时全平台收集；
          # Windows WebView2 interop DLL 仅存在于 win wheel，onefile 需平铺到 _MEIPASS 根目录
          extra_flags=""
          webview_lib=$(python -c "import webview,os;print(os.path.dirname(webview.__file__))" 2>/dev/null || true)
          if [ -n "$webview_lib" ] && [ -f "$webview_lib/lib/Microsoft.Web.WebView2.Core.dll" ]; then
            extra_flags="$extra_flags --add-data $webview_lib/lib/Microsoft.Web.WebView2.Core.dll${sep}."
            extra_flags="$extra_flags --add-data $webview_lib/lib/Microsoft.Web.WebView2.WinForms.dll${sep}."
            extra_flags="$extra_flags --add-data $webview_lib/lib/WebBrowserInterop.x64.dll${sep}."
            extra_flags="$extra_flags --add-data $webview_lib/lib/runtimes/win-x64/native/WebView2Loader.dll${sep}."
            extra_flags="$extra_flags --add-data $webview_lib/lib/runtimes/win-x64${sep}win-x64"
          fi
          icon_flag=""
          if [ -n "${{ matrix.icon }}" ]; then
            icon_flag="--icon ${{ matrix.icon }}"
          fi
          # v2.0.17：Windows 构建嵌入 comctl32 v6 manifest（关闭钩子 SetWindowSubclass 依赖；
          # 非 Windows 平台跳过——manifest 仅对 Windows 有意义）
          manifest_flag=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            manifest_flag="--manifest packaging/windows/app.manifest.xml"
          fi
          pyinstaller --name DaybreakToolbox --clean --noconfirm \
            --exclude-module keyring \
            --exclude-module transformers --exclude-module torch \
            --exclude-module torchvision --exclude-module torchaudio \
            --exclude-module datasets --exclude-module tokenizers \
            --collect-all pythonnet --collect-all clr_loader --hidden-import clr \
            --add-data "web/dist${sep}dist" --add-data "config${sep}config" \
            $extra_flags \
            $icon_flag \
            $manifest_flag \
            ${{ matrix.pyinstaller }} run_bridge.py
          echo "build done: $(ls dist | head -5 | tr '\n' ' ')"

      - name: Package zip (跨平台统一用 python shutil)
        if: ${{ !matrix.build-setup }}
        shell: bash
        run: |
          case "${{ github.ref_name }}" in
            v*) ver="${{ github.ref_name }}" ;;
            *)  ver="manual" ;;
          esac
          out="Daybreak-Toolbox-${ver}-${{ matrix.artifact-suffix }}"
          # v2.1.1：产物为 onedir（dist/DaybreakToolbox/ 目录，mac 另有 DaybreakToolbox.app）。
          # 打包根目录按平台选择：mac 保留 .app（双击即用）；windows/linux 打包应用目录本身，
          # 解压得到单一文件夹（README 放进该文件夹内），避免「解压后先看到一层壳」。
          if [ -d "dist/DaybreakToolbox.app" ]; then
            cp README.md dist/README.md
            python -c "import shutil; shutil.make_archive('${out}', 'zip', 'dist')"
          elif [ -d "dist/DaybreakToolbox" ]; then
            cp README.md dist/DaybreakToolbox/README.md
            python -c "import shutil; shutil.make_archive('${out}', 'zip', 'dist/DaybreakToolbox')"
          else
            cp README.md dist/README.md
            python -c "import shutil; shutil.make_archive('${out}', 'zip', 'dist')"
          fi
          ls -la "${out}.zip"

      - name: Build Inno Setup installer (Windows 安装程序)
        if: ${{ matrix.build-setup }}
        shell: bash
        run: |
          case "${{ github.ref_name }}" in
            v*) ver="${{ github.ref_name }}" ;;
            *)  ver="manual" ;;
          esac
          num="${ver#v}"   # Inno VersionNumber 要求纯点分数字
          # 版本常量写入 _defines.inc（setup.iss 以 #include 引入；不用 /D:——runner 上实测不生效）
          printf '#define AppVersion "%s"\n#define AppVerNum  "%s"\n' "$ver" "$num" > packaging/windows/_defines.inc
          # MSYS_NO_PATHCONV=1：防 Git Bash 把 / 开头参数当路径转换
          MSYS_NO_PATHCONV=1 iscc packaging/windows/setup.iss
          # 产物在 packaging/windows/out/ → 挪到工作区根，供上传步骤引用
          mv "packaging/windows/out/Daybreak-Toolbox-${ver}-win-setup.exe" .
          ls -la "Daybreak-Toolbox-${ver}-win-setup.exe"

      - name: Upload to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          case "${{ github.ref_name }}" in
            v*) ver="${{ github.ref_name }}" ;;
            *)  ver="manual" ;;
          esac
          # 幂等建 Release（5 平台并行：先完成者创建，其余跳过）
          if ! gh release view "$ver" >/dev/null 2>&1; then
            gh release create "$ver" \
              --title "Daybreak Toolbox $ver" \
              --notes "破晓·工具箱 $ver 多平台安装包（Windows / macOS / Linux，包内含 README）。
              Windows：推荐 win-setup.exe 安装程序（选安装路径）；或解压 zip 运行 DaybreakToolbox.exe（托盘常驻）；
              macOS：双击 DaybreakToolbox.app（首次 右键→打开 绕过 Gatekeeper）；
              Linux：解压运行 ./DaybreakToolbox（需系统含 libgtk；托盘仅 Windows 生效）。" \
              --target "${{ github.sha }}" || echo "release create raced/skipped"
          fi
          # 资产：win-setup 条目上传 Inno 安装程序（.exe），其余条目上传 zip
          if [ "${{ matrix.build-setup }}" = "true" ]; then
            asset="Daybreak-Toolbox-${ver}-win-setup.exe"
          else
            asset="Daybreak-Toolbox-${ver}-${{ matrix.artifact-suffix }}.zip"
          fi
          for i in 1 2 3 4 5; do
            gh release upload "$ver" "$asset" --clobber && break
            sleep $((i * 5))
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact (manual / non-tag)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: daybreak-${{ matrix.artifact-suffix }}
          path: ${{ matrix.build-setup && 'Daybreak-Toolbox-*-win-setup.exe' || 'Daybreak-Toolbox-*.zip' }}
          if-no-files-found: error
